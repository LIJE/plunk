# LIJE / Plunk - Hostinger VPS Docker Manager
# Source du code Plunk : https://github.com/LIJE/plunk (branche next)
# Fichier a publier dans le Fork, puis a importer avec « Compose from URL ».
# Les variables ${...:?...} doivent etre definies dans l'environnement du projet
# Hostinger AVANT de lancer le deploiement. Ne jamais publier les secrets sur GitHub.
# Reverse proxy HTTPS a configurer separement pour les domaines et MinIO.
name: plunk-compose

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: plunk
      POSTGRES_USER: plunk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obligatoire}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plunk -d plunk"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plunk

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plunk

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-plunk}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire}
    volumes:
      - minio_data:/data
    # Ports uniquement sur l'hote local : ne pas exposer MinIO publiquement.
    ports:
      - "127.0.0.1:19000:9000" # API S3 - pour reverse proxy HTTPS des fichiers
      - "127.0.0.1:19001:9001" # Console d'administration MinIO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - plunk

  ntfy:
    image: binwiederhier/ntfy:latest
    restart: unless-stopped
    command: serve
    environment:
      TZ: Europe/Paris
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_etc:/etc/ntfy
    # ntfy est accessible aux autres services dans le reseau Docker, pas sur Internet.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - plunk

  plunk:
    # IMPORTANT : on construit ton Fork, et non ghcr.io/useplunk/plunk:latest.
    # Necessite un Docker Manager avec support du build via contexte Git distant.
    build:
      context: https://github.com/LIJE/plunk.git#next
      dockerfile: Dockerfile
    image: lije/plunk:next
    pull_policy: build
    restart: unless-stopped
    environment:
      SERVICE: all
      NODE_ENV: production

      DATABASE_URL: postgresql://plunk:${DB_PASSWORD:?DB_PASSWORD obligatoire}@postgres:5432/plunk
      DIRECT_DATABASE_URL: postgresql://plunk:${DB_PASSWORD:?DB_PASSWORD obligatoire}@postgres:5432/plunk
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET obligatoire}
      NGINX_PORT: "80"

      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN obligatoire}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:?DASHBOARD_DOMAIN obligatoire}
      LANDING_DOMAIN: ${LANDING_DOMAIN:?LANDING_DOMAIN obligatoire}
      WIKI_DOMAIN: ${WIKI_DOMAIN:?WIKI_DOMAIN obligatoire}
      USE_HTTPS: "true"
      # Le script de demarrage de Plunk genere les URL depuis les domaines ci-dessus.
      API_URI: ${API_URI:-}
      DASHBOARD_URI: ${DASHBOARD_URI:-}
      LANDING_URI: ${LANDING_URI:-}
      WIKI_URI: ${WIKI_URI:-}

      AWS_SES_REGION: ${AWS_SES_REGION:?AWS_SES_REGION obligatoire}
      AWS_SES_ACCESS_KEY_ID: ${AWS_SES_ACCESS_KEY_ID:?AWS_SES_ACCESS_KEY_ID obligatoire}
      AWS_SES_SECRET_ACCESS_KEY: ${AWS_SES_SECRET_ACCESS_KEY:?AWS_SES_SECRET_ACCESS_KEY obligatoire}
      SES_CONFIGURATION_SET: ${SES_CONFIGURATION_SET:?SES_CONFIGURATION_SET obligatoire}
      SES_CONFIGURATION_SET_NO_TRACKING: ${SES_CONFIGURATION_SET_NO_TRACKING:-}
      MAIL_FROM_SUBDOMAIN: ${MAIL_FROM_SUBDOMAIN:-}
      EMAIL_RATE_LIMIT_PER_SECOND: ${EMAIL_RATE_LIMIT_PER_SECOND:-}

      GITHUB_OAUTH_CLIENT: ${GITHUB_OAUTH_CLIENT:-}
      GITHUB_OAUTH_SECRET: ${GITHUB_OAUTH_SECRET:-}
      GOOGLE_OAUTH_CLIENT: ${GOOGLE_OAUTH_CLIENT:-}
      GOOGLE_OAUTH_SECRET: ${GOOGLE_OAUTH_SECRET:-}
      STRIPE_SK: ${STRIPE_SK:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_EMAIL_USAGE: ${STRIPE_PRICE_EMAIL_USAGE:-}
      STRIPE_METER_EVENT_NAME: ${STRIPE_METER_EVENT_NAME:-emails}

      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-plunk}
      S3_ACCESS_KEY_SECRET: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obligatoire}
      S3_BUCKET: ${S3_BUCKET:-uploads}
      # Doit pointer vers le reverse proxy HTTPS de l'API MinIO (bucket inclus).
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:?S3_PUBLIC_URL obligatoire}
      S3_FORCE_PATH_STYLE: "true"
      S3_PREFIX: ${S3_PREFIX:-}

      NTFY_URL: http://ntfy/plunk-notifications
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      PLUNK_API_KEY: ${PLUNK_API_KEY:-}
      PLUNK_FROM_ADDRESS: ${PLUNK_FROM_ADDRESS:-}
      AUTO_PROJECT_DISABLE: "false"
      # Apres creation du premier compte, mettre DISABLE_SIGNUPS=true.
      DISABLE_SIGNUPS: ${DISABLE_SIGNUPS:-false}

    volumes:
      - plunk_data:/app/data
    ports:
      # Accessible uniquement sur le VPS. Le HTTPS public passera par un proxy.
      - "127.0.0.1:18080:80"
      # Ne pas publier 465 / 587 avant configuration des certificats SMTP.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ntfy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - plunk

volumes:
  postgres_data:
  redis_data:
  minio_data:
  plunk_data:
  ntfy_cache:
  ntfy_etc:

networks:
  plunk:
    driver: bridge
