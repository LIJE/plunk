
name: Build Plunk Docker

on:
  push:
    branches:
      - next
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Plunk
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ghcr.io/lije/plunk:next
          labels: |
            org.opencontainers.image.source=https://github.com/LIJE/plunk
          build-args: |
            API_URI=https://api.smtprelais.com
            DASHBOARD_URI=https://app.smtprelais.com
            LANDING_URI=https://www.smtprelais.com
            WIKI_URI=https://docs.smtprelais.com
